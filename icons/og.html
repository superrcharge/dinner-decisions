<!doctype html>
<!-- The link preview card (og-image.png, 1200x630) that shows when someone
     texts or posts a dinnerdecisions.app link. Rendered by render-og.mjs;
     not served. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Public+Sans:wght@500;600&display=block">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 0 96px;
    display: flex;
    align-items: center;
    gap: 64px;
    background: #176B4B;
    color: #FFFFFF;
    font-family: "Public Sans", sans-serif;
  }
  .pot {
    flex: none;
    width: 260px;
    height: 260px;
    border-radius: 58px;
    background: #F3F5F0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    font-size: 160px;
    line-height: 1;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 92px;
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 0 0 22px;
  }
  p {
    font-size: 36px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 28px;
    color: #DDF0E5;
  }
  .foot {
    font-size: 26px;
    font-weight: 600;
    color: #A9D8BE;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="pot">🍲</div>
  <div>
    <h1>Dinner Decisions</h1>
    <p>The whole family votes on this week&rsquo;s dinners. The shopping list builds itself.</p>
    <p class="foot">Free &middot; No accounts &middot; No email</p>
  </div>
</body>
</html>
