# The Firestore emulator is a Java program. Pinning it here keeps it local to
# this project rather than asking for a system-wide install.
[tools]
java = "temurin-21"

[tasks.render]
description = "Compile the diagrams to dual-theme SVGs"
run = "bash diagrams/render.sh"

[tasks.icons]
description = "Regenerate the home-screen and favicon PNGs"
run = "bash icons/render-icons.sh"

[tasks.app-icons]
description = "Regenerate the store apps' icons and splash screens in android/ and ios/"
run = "bash icons/render-app-assets.sh"

[tasks.clean-diagrams]
description = "Remove the rendered diagram SVGs"
run = "find diagrams -type f -name '*.svg' -delete"

[tasks.rules-test]
description = "Run the security rules tests against the local emulator"
run = "npm run test:rules"

[tasks.e2e]
description = "Run the browser tests against the local emulators"
run = "npm run test:e2e"

[tasks.rules-deploy]
description = "Publish firestore.rules to the live project (needs `firebase login` once)"
run = "npm run rules:deploy"

[tasks.site-deploy]
description = "Publish the website to Firebase Hosting (dinnerdecisions.app); copies only the served files into dist/ first"
run = "npx firebase deploy --only hosting"

[tasks.live-check]
description = "Smoke-test the deployed site with a throwaway family, then delete it (needs `firebase login`)"
run = "npm run test:live"

[tasks.app-sync]
description = "Bundle the website into the store apps (www/) and copy it into android/ and ios/"
run = "npm run app:build"

[tasks.app-test]
description = "Check the store apps' bundle is the website plus only Capacitor and local Firebase"
run = "npm run test:app"

[tasks.android-debug]
description = "Build the Android app as a debug APK (build/DinnerDecisions-debug.apk) for a test phone"
run = "bash scripts/android-debug.sh"

[tasks.android-test]
description = "Build the emulator test APK and drive it on a running Android emulator, against the Firebase emulators"
run = [
  "bash scripts/android-debug.sh --emulators",
  "npx firebase emulators:exec --only auth,firestore --project demo-dinner-decisions \"playwright test --config playwright.android.config.mjs\"",
]

[tasks.store-screenshots]
description = "Make the store screenshots and Play feature graphic from a sample family on the emulators (store/screenshots, store/graphics)"
run = "npx firebase emulators:exec --only auth,firestore --project demo-dinner-decisions \"playwright test --config playwright.store.config.mjs\""
